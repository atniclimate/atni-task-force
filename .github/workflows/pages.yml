name: Deploy site to GitHub Pages

# One publisher: only the contents of site/ are uploaded, never the repository root.
# The release-boundary check runs first; any problem stops the deploy.
on:
  push:
    branches: [main]
    paths: ['site/**', 'scripts/validate_public.py', 'scripts/pour_claim_refs.py', 'docs/CONTENT-SLOTS.md', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Check the public folder
        run: |
          python -m pip install --disable-pip-version-check pymupdf==1.27.2
          python scripts/validate_public.py
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
