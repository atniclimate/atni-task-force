name: Deploy site to GitHub Pages

# One publisher: only the contents of site/ are uploaded, never the repository root.
# The release-boundary check runs first; any problem stops the deploy.
on:
  push:
    branches: [main]
    paths: ['site/**', 'scripts/validate_public.py', 'docs/CONTENT-SLOTS.md', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check the public folder
        run: |
          python -m pip install --disable-pip-version-check pymupdf==1.27.2
          python scripts/validate_public.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
