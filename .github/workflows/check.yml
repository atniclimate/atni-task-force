name: Check

# Branch and pull request check: the public-folder validator and the tests that run from a clean clone.
# No deploy and no write access; pages.yml alone publishes, from main.
on:
  push:
    branches-ignore: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  check:
    # A same-repo branch with an open PR is checked by its push run only; a fork's PR has no push run here.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pymupdf==1.27.2 pytest==9.1.1
      - name: Check the public folder
        run: python scripts/validate_public.py
      # Every file here passed in a clone with no work/ or planning-T1/; tests that need those files skip, and -rs names them.
      - name: Tests
        run: >-
          python -m pytest -q -rs
          tests/test_briefing_pdf.py tests/test_ci_list.py tests/test_claim_refs.py tests/test_energy_claims.py tests/test_energy_potential.py
          tests/test_exports.py tests/test_freshness.py tests/test_gates.py tests/test_index_briefing.py tests/test_intake.py tests/test_page_meta.py
          tests/test_pages.py tests/test_plates.py tests/test_resource_model.py tests/test_site_counts.py tests/test_climate_regions.py tests/test_projects.py
